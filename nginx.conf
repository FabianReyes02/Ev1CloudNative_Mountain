# Upstreams del backend (misma VPC). Para escalar con más EC2, agregar
# líneas `server IP:PUERTO;` en cada upstream (misma ruta, más destinos).
upstream backend_productos {
    server 10.0.128.111:8081;
}

upstream backend_usuarios {
    server 10.0.128.111:8083;
}

upstream backend_pedidos {
    server 10.0.128.111:8082;
}

# Backend-2 (EC2 10.0.146.240). Para escalar, agregar líneas server.
upstream backend2_notificaciones {
    server 10.0.146.240:8084;
}

upstream backend2_carrito {
    server 10.0.146.240:8085;
}

upstream backend2_envios {
    server 10.0.146.240:8086;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API: ruteo directo a cada microservicio (sin gateway intermedio).
    # Se reescribe /api/X -> /X porque los MS exponen sus rutas en raíz.
    location /api/products {
        rewrite ^/api/products(/.*)?$ /products$1 break;
        proxy_pass http://backend_productos;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    location /api/auth/ {
        rewrite ^/api/auth(/.*)?$ /auth$1 break;
        proxy_pass http://backend_usuarios;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    location /api/orders {
        rewrite ^/api/orders(/.*)?$ /orders$1 break;
        proxy_pass http://backend_pedidos;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    location = /api/usuarios/endpoints {
        proxy_pass http://backend_usuarios/api/endpoints;
        proxy_set_header Host $host;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # Backend-2: se reescribe /api/X -> /X porque los MS exponen en raíz.
    location /api/notifications {
        rewrite ^/api/notifications(/.*)?$ /notifications$1 break;
        proxy_pass http://backend2_notificaciones;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    location /api/cart {
        rewrite ^/api/cart(/.*)?$ /cart$1 break;
        proxy_pass http://backend2_carrito;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    location /api/shipments {
        rewrite ^/api/shipments(/.*)?$ /shipments$1 break;
        proxy_pass http://backend2_envios;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
