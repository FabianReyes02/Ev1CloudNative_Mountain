events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Compresión para JS/CSS/SVG/JSON: reduce ~70% el tamaño de los bundles.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---------------------------------------------------------------------------
    # IPs privadas canónicas (docs/DESPLIEGUE_AWS.md de backend-3):
    #   frontend 10.0.1.10 | backend-1 10.0.1.11 | backend-2 10.0.1.12 | backend-3 10.0.1.13
    # Backend-1 (EC2 backend-1, IP privada — cambiar al crear la instancia)
    # ---------------------------------------------------------------------------
    upstream backend1_productos {
        server 10.0.1.11:8081;
    }

    upstream backend1_usuarios {
        server 10.0.1.11:8083;
    }

    upstream backend1_pedidos {
        server 10.0.1.11:8082;
    }

    # ---------------------------------------------------------------------------
    # Backend-2 (EC2 backend-2, IP privada — cambiar al crear la instancia)
    # ---------------------------------------------------------------------------
    upstream backend2_notificaciones {
        server 10.0.1.12:8084;
    }

    upstream backend2_carrito {
        server 10.0.1.12:8085;
    }

    upstream backend2_envios {
        server 10.0.1.12:8086;
    }

    # ---------------------------------------------------------------------------
    # Backend-3 (EC2 backend-3, IP privada — cambiar al crear la instancia)
    # ---------------------------------------------------------------------------
    upstream backend3_pagos {
        server 10.0.1.13:8087;
    }

    upstream backend3_recomendaciones {
        server 10.0.1.13:8088;
    }

# ---------------------------------------------------------------------------
# AWS API Gateway sirve el frontend estático:
# https://40k6dgt9t8.execute-api.us-east-1.amazonaws.com/
# Las rutas /api/* se resuelven directamente en Nginx (dentro de la VPC).
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Los bundles de Vite llevan hash en el nombre: cache inmutable 1 año.
    # 404 real si no existe (no caer al index.html: enmascara errores).
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # -----------------------------------------------------------------------
    # Nginx directo — rutas públicas (productos, auth, usuarios, recomendaciones)
    # Backend-1: productos y usuarios
    # -----------------------------------------------------------------------

    location /api/products {
        rewrite ^/api/products(/.*)?$ /products$1 break;
        proxy_pass http://backend1_productos;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    location /api/auth {
        rewrite ^/api/auth(/.*)?$ /auth$1 break;
        proxy_pass http://backend1_usuarios;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    location /api/users {
        rewrite ^/api/users(/.*)?$ /users$1 break;
        proxy_pass http://backend1_usuarios;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # Backend-3: recomendaciones
    location /api/recommendations {
        rewrite ^/api/recommendations(/.*)?$ /recommendations$1 break;
        proxy_pass http://backend3_recomendaciones;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # -----------------------------------------------------------------------
    # Nginx directo — rutas internas (protegidas con JWT en el frontend)
    # -----------------------------------------------------------------------

    # Backend-1: pedidos
    location /api/orders {
        rewrite ^/api/orders(/.*)?$ /orders$1 break;
        proxy_pass http://backend1_pedidos;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # Backend-2: notificaciones, carrito, envíos
    location /api/notifications {
        rewrite ^/api/notifications(/.*)?$ /notifications$1 break;
        proxy_pass http://backend2_notificaciones;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    location /api/cart {
        rewrite ^/api/cart(/.*)?$ /cart$1 break;
        proxy_pass http://backend2_carrito;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    location /api/shipments {
        rewrite ^/api/shipments(/.*)?$ /shipments$1 break;
        proxy_pass http://backend2_envios;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # Backend-3: pagos
    location /api/payments {
        rewrite ^/api/payments(/.*)?$ /payments$1 break;
        proxy_pass http://backend3_pagos;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
}
